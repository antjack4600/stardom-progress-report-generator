[project]
name = "stardom-progress-report-generator"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[project.scripts]
stardom-progress-report-generator = "stardom_progress_report_generator:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
